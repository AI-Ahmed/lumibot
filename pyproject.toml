# pyproject.toml seems to be more popular than setup.cfg these days.  Adding
# configs for tools that use it and will port as much here as possible.

[build-system]
requires = ["setuptools>=61.0", "wheel", "python-dotenv"]
build-backend = "setuptools.build_meta"

[project]
name = "lumibot"
version = "4.4.55"
description = "Backtesting and Trading Library, Made by Lumiwealth."
requires-python = ">=3.10"
# Fields defined dynamically in setup.py
dynamic = ["readme", "license", "authors", "classifiers", "dependencies", "optional-dependencies"]


# Ruff is a tool that combines several linters into one including Flake8 and isort.
# Runs much faster than running them individually.
[tool.ruff]
line-length = 120

# Assume Python 3.8+ for type annotations
target-version = "py38"

select = [
  "A",  # prevent using keywords that clobber python builtins
  "B",  # bugbear: security warnings
  "E",   # pycodestyle
  "F", # pyflakes
  "W", # pycodestyle
  "UP", # pyupgrade
  "I",  # isort
  #  "D",   # pydocstyle
]
